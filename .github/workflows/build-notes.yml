name: Build original LaTeX readings
on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - '.github/workflows/build-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Module 1 reading
        uses: xu-cheng/latex-action@v3
        with:
          root_file: standalone.tex
          working_directory: notes
          latexmk_use_xelatex: false
      - name: Compile Module 2 reading
        uses: xu-cheng/latex-action@v3
        with:
          root_file: module02.tex
          working_directory: notes
      - name: Compile Module 3 reading
        uses: xu-cheng/latex-action@v3
        with:
          root_file: module03.tex
          working_directory: notes
      - name: Compile Module 4 reading
        uses: xu-cheng/latex-action@v3
        with:
          root_file: module04.tex
          working_directory: notes
      - name: Compile Module 5 reading
        uses: xu-cheng/latex-action@v3
        with:
          root_file: module05.tex
          working_directory: notes
      - name: Compile collected textbook
        uses: xu-cheng/latex-action@v3
        with:
          root_file: master.tex
          working_directory: notes
          latexmk_use_xelatex: false
      - name: Publish PDFs
        run: |
          mkdir -p pdfs
          cp notes/standalone.pdf pdfs/PrecalcII_Week01.pdf
          cp notes/module02.pdf pdfs/PrecalcII_Week02.pdf
          cp notes/module03.pdf pdfs/PrecalcII_Week03.pdf
          cp notes/module04.pdf pdfs/PrecalcII_Week04.pdf
          cp notes/module05.pdf pdfs/PrecalcII_Week05.pdf
          cp notes/master.pdf pdfs/PrecalculusII_Complete_Reader.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs
          if ! git diff --cached --quiet; then
            git commit -m "Compile course reading PDFs"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published PDFs successfully"
                exit 0
              fi
              echo "Concurrent update detected; retrying ($attempt/5)"
              sleep 3
            done
            echo "Could not publish PDFs after retries"
            exit 1
          fi
